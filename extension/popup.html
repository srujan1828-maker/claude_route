<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2a2a4a;
    }

    .header .icon {
      font-size: 24px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header .version {
      font-size: 11px;
      color: #888;
      margin-left: auto;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-bar.connected {
      background: #0d3320;
      border: 1px solid #1a6b3c;
      color: #4ade80;
    }

    .status-bar.disconnected {
      background: #3b1515;
      border: 1px solid #6b1a1a;
      color: #f87171;
    }

    .status-bar.checking {
      background: #2a2a0d;
      border: 1px solid #6b6b1a;
      color: #fbbf24;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .connected .dot { background: #4ade80; }
    .disconnected .dot { background: #f87171; }
    .checking .dot { background: #fbbf24; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      background: #0f0f23;
      color: #e0e0e0;
      font-size: 13px;
      font-family: 'Consolas', 'Monaco', monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #6366f1;
    }

    input::placeholder {
      color: #555;
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-save {
      background: #6366f1;
      color: #fff;
    }

    .btn-test {
      background: #2a2a4a;
      color: #e0e0e0;
    }

    .toast {
      display: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
    }

    .toast.success {
      display: block;
      background: #0d3320;
      border: 1px solid #1a6b3c;
      color: #4ade80;
    }

    .toast.error {
      display: block;
      background: #3b1515;
      border: 1px solid #6b1a1a;
      color: #f87171;
    }

    .presets {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #2a2a4a;
    }

    .presets label {
      margin-bottom: 8px;
    }

    .preset-btn {
      display: block;
      width: 100%;
      padding: 7px 12px;
      margin-bottom: 4px;
      background: #0f0f23;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #bbb;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .preset-btn:hover {
      border-color: #6366f1;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">🌉</span>
    <h1>Claude Web Bridge</h1>
    <span class="version">v2.0</span>
  </div>

  <div id="status" class="status-bar checking">
    <span class="dot"></span>
    <span id="statusText">Checking…</span>
  </div>

  <div class="form-group">
    <label>Server WebSocket URL</label>
    <input type="text" id="serverUrl" placeholder="wss://your-app.up.railway.app/ws">
    <div class="hint">Use ws:// for local, wss:// for cloud</div>
  </div>

  <div class="form-group">
    <label>WebSocket Secret</label>
    <input type="password" id="wsSecret" placeholder="Leave empty for local (no auth)">
    <div class="hint">Must match WS_SECRET on the server</div>
  </div>

  <div class="btn-row">
    <button class="btn-save" id="saveBtn">💾 Save & Reconnect</button>
    <button class="btn-test" id="testBtn">🔍 Test</button>
  </div>

  <div id="toast" class="toast"></div>

  <div class="presets">
    <label>Quick Presets</label>
    <button class="preset-btn" data-url="ws://localhost:8080/ws">🖥️ Local — ws://localhost:8080/ws</button>
    <button class="preset-btn" data-url="wss://">☁️ Railway — wss://_____.up.railway.app/ws</button>
    <button class="preset-btn" data-url="wss://">☁️ Render — wss://_____.onrender.com/ws</button>
    <button class="preset-btn" data-url="wss://">☁️ Fly.io — wss://_____.fly.dev/ws</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
